[package]
name = "doctty-rust-webkit-adapter"
version = "0.0.0"
edition = "2024"
publish = false

# Intentionally NOT in the root Cargo workspace. Keep objc2 unsafe FFI
# isolated from doctty's crate-wide unsafe_code = "forbid" contract.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSView", "NSImage", "NSBitmapImageRep"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSRunLoop", "NSURL", "NSString", "NSError", "NSData", "NSDictionary"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation", "block2"] }
