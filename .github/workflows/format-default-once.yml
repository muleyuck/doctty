name: Apply default rustfmt once

on:
  push:
    branches:
      - chore/use-default-rustfmt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: muleyuck/github-actions/actions/rust/setup@v1
      - name: Format Rust code
        run: |
          test ! -e rustfmt.toml
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style: apply default rustfmt to Rust sources"
            git push origin HEAD:refs/heads/chore/use-default-rustfmt
          fi
