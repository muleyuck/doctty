name: Rust WebKit Adapter PoC

on:
  push:
    branches:
      - experiment/rust-webkit-adapter
  pull_request:
    paths:
      - 'experiments/rust-webkit-adapter/**'
      - '.github/workflows/rust-webkit-adapter.yml'

jobs:
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check isolated WebKit crate
        run: cargo check --manifest-path experiments/rust-webkit-adapter/Cargo.toml --all-targets
      - name: Unit tests (protocol)
        run: cargo test --manifest-path experiments/rust-webkit-adapter/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path experiments/rust-webkit-adapter/Cargo.toml --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --manifest-path experiments/rust-webkit-adapter/Cargo.toml --all -- --check
      - name: Compile release binary
        run: cargo build --release --manifest-path experiments/rust-webkit-adapter/Cargo.toml
      # The macOS-15 runner successfully captured native WKWebView PNGs,
      # including a responsive resize, in earlier commits. Keep this as a
      # required regression gate; Ghostty visual/CPU parity remains manual.
      - name: Validate native smoke script syntax
        run: python3 -m py_compile experiments/rust-webkit-adapter/tests/smoke_snapshot.py
      - name: Native WebKit protocol and PNG smoke
        timeout-minutes: 2
        run: |
          python3 experiments/rust-webkit-adapter/tests/smoke_snapshot.py \
            experiments/rust-webkit-adapter/target/release/doctty-rust-webkit-adapter
