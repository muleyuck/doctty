name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: muleyuck/github-actions/.github/workflows/ci-rust.yml@v1
    with:
      test-command: make ci
      install-args: rust
      runs-on: ubuntu-latest

  macos-build:
    uses: muleyuck/github-actions/.github/workflows/ci-rust.yml@v1
    with:
      test-command: cargo build --release --locked && cargo test --locked --no-default-features --lib default_backend_tracks_explicit_ci_bundle_feature
      install-args: rust
      runs-on: macos-latest
