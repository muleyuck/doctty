name: macOS Eco bundle validation

on:
  pull_request:
    paths:
      - 'src/bin/doctty-eco.rs'
      - 'src/io/webkit_snapshot/**'
      - 'src/render/github_html/**'
      - 'src/eco/**'
      - 'native/macos/webkit_viewport.swift'
      - 'scripts/build_macos_webkit_helper.sh'
      - 'scripts/package_macos_eco.sh'
      - 'scripts/package_macos_release.sh'
      - 'scripts/check_release_readiness.py'
      - 'packaging/doctty.rb.in'
      - '.github/release-please-config.json'
      - '.github/.release-please-manifest.json'
      - '.github/workflows/release-please.yml'
      - 'src/app/**'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'
      - 'src/cli/args.rs'
      - 'tests/unit/cli_args.rs'
      - 'tests/smoke/smoke_compiled_swift_webkit.py'
      - 'tests/smoke/smoke_eco_default_cli.py'
      - '.github/workflows/macos-eco-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-bundle:
    # Initial release target: Apple Silicon only. Intel can be revisited
    # when there is concrete user demand and validation capacity.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: muleyuck/github-actions/actions/rust/setup@v1

      - name: Check first-release config and safe manual-only publication
        shell: bash
        run: |
          python3 scripts/check_release_readiness.py
          bash -n scripts/package_macos_eco.sh
          bash -n scripts/package_macos_release.sh

      - name: Verify native architecture and Cargo-source regression
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          cargo test --locked --no-default-features --lib default_backend_tracks_explicit_ci_bundle_feature

      - name: Build precompiled Rust and Swift Eco bundle
        id: package
        shell: bash
        run: |
          archive="$(bash scripts/package_macos_eco.sh)"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Validate archive and packed native Swift protocol
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          dir="$RUNNER_TEMP/unpacked-doctty"
          mkdir -p "$dir"
          (
            cd "$(dirname "$archive")"
            shasum -a 256 -c "$(basename "$archive").sha256"
          )
          tar -xzf "$archive" -C "$dir"
          bundle="$dir/$(basename "$archive" .tar.gz)"
          test -x "$bundle/doctty"
          test -x "$bundle/doctty-webkit-swift"
          test -x "$bundle/doctty-eco"
          # Check all three native binaries are built for this runner.
          # A mislabeled cross-architecture archive must fail the workflow.
          for executable in doctty doctty-eco doctty-webkit-swift; do
            lipo "$bundle/$executable" -verify_arch arm64
          done
          (cd "$bundle" && shasum -a 256 -c SHA256SUMS)
          python3 tests/smoke/smoke_compiled_swift_webkit.py "$bundle/doctty-webkit-swift"
          # Exercise the real compiled doctty CLI with pseudo-terminal I/O
          # and stub sidecars, verifying default routing without WebKit GUI.
          python3 tests/smoke/smoke_eco_default_cli.py "$bundle"
          # Normal default CLI and --no-mermaid keep the headless
          # noninteractive text contract; no Swift/Cargo execution.
          printf '# Bundled cli smoke\\n' | "$bundle/doctty" - > "$RUNNER_TEMP/headless-default.txt"
          grep -q 'Bundled cli smoke' "$RUNNER_TEMP/headless-default.txt"
          printf '# Bundled no-mermaid\\n' | "$bundle/doctty" --no-mermaid - > "$RUNNER_TEMP/headless-disabled.txt"
          grep -q 'Bundled no-mermaid' "$RUNNER_TEMP/headless-disabled.txt"
          # Keep hidden compatibility options parseable in scripted use.
          printf '# Legacy flag\\n' | "$bundle/doctty" --legacy-renderer - > "$RUNNER_TEMP/headless-legacy.txt"
          grep -q 'Legacy flag' "$RUNNER_TEMP/headless-legacy.txt"

      - name: Verify ad-hoc-signed release ZIP without publishing
        id: release_zip
        shell: bash
        run: |
          bash -n scripts/package_macos_release.sh
          ruby -c packaging/doctty.rb.in
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          archive="${{ steps.package.outputs.archive }}"
          out="$RUNNER_TEMP/doctty-release-zip"
          zip="$(bash scripts/package_macos_release.sh "$archive" "$version" "$out")"
          test -s "$zip"
          (cd "$out" && shasum -a 256 -c "$(basename "$zip").sha256")
          extracted="$RUNNER_TEMP/unpacked-release-zip"
          mkdir -p "$extracted"
          ditto -x -k "$zip" "$extracted"
          bundle="$extracted/doctty-macos-arm64"
          (cd "$bundle" && shasum -a 256 -c SHA256SUMS)
          for executable in doctty doctty-eco doctty-webkit-swift; do
            codesign --verify --strict "$bundle/$executable"
            lipo "$bundle/$executable" -verify_arch arm64
          done
          bash -n "$bundle/doctty-cli"
          test -x "$bundle/doctty-cli"
          test -x "$bundle/doctty"
          # Replicate Homebrew's binary symlink without changing PATH.
          ln -s "$bundle/doctty-cli" "$RUNNER_TEMP/doctty-cask-symlink"
          printf '# Cask symlink smoke\n' | "$RUNNER_TEMP/doctty-cask-symlink" - > "$RUNNER_TEMP/cask-headless.txt"
          grep -q 'Cask symlink smoke' "$RUNNER_TEMP/cask-headless.txt"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "checksum=$zip.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render and style-check the Homebrew Cask without publishing
        uses: muleyuck/github-actions/actions/homebrew/render@v1
        with:
          template: packaging/doctty.rb.in
          tap-path: Casks/doctty.rb
          version: ${{ steps.release_zip.outputs.version }}
          sha256: SHA256=${{ steps.release_zip.outputs.zip }}

      # Downloadable 14-day pre-release artifact for Apple Silicon install
      # checks. Never call this an official notarized or GitHub Release asset.
      - name: Upload ad-hoc-signed ZIP release candidate
        uses: actions/upload-artifact@v4
        with:
          name: doctty-ad-hoc-signed-arm64-review
          path: |
            ${{ steps.release_zip.outputs.zip }}
            ${{ steps.release_zip.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      # Preview only: no GitHub Release publication and no source compiler
      # dependency in the extracted application bundle.
      - name: Upload prebuilt preview archive
        uses: actions/upload-artifact@v4
        with:
          name: doctty-eco-prebuilt-${{ runner.os }}-arm64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
