name: macOS prebuilt Eco preview bundle

on:
  pull_request:
    paths:
      - 'examples/webkit_viewport_poc.rs'
      - 'examples/hybrid_image_preview/**'
      - 'experiments/webkit_viewport.swift'
      - 'experiments/run_compiled_swift_hybrid.sh'
      - 'experiments/package_macos_hybrid.sh'
      - 'experiments/smoke_compiled_swift_webkit.py'
      - '.github/workflows/macos-hybrid-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: muleyuck/github-actions/actions/rust/setup@v1

      - name: Build optimized Swift and Rust Eco preview bundle
        id: package
        shell: bash
        run: |
          archive="$(bash experiments/package_macos_hybrid.sh)"
          test -s "$archive"
          test -s "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Validate archive and packed native Swift protocol
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          dir="$RUNNER_TEMP/unpacked-doctty"
          mkdir -p "$dir"
          (
            cd "$(dirname "$archive")"
            shasum -a 256 -c "$(basename "$archive").sha256"
          )
          tar -xzf "$archive" -C "$dir"
          bundle="$dir/$(basename "$archive" .tar.gz)"
          test -x "$bundle/doctty-hybrid"
          test -x "$bundle/doctty-webkit-swift"
          test -x "$bundle/webkit_viewport_poc"
          bash -n "$bundle/doctty-hybrid"
          (cd "$bundle" && shasum -a 256 -c SHA256SUMS)
          python3 experiments/smoke_compiled_swift_webkit.py "$bundle/doctty-webkit-swift"

      # Preview only: no GitHub Release publication and no source compiler
      # dependency in the extracted application bundle.
      - name: Upload prebuilt preview archive
        uses: actions/upload-artifact@v4
        with:
          name: doctty-hybrid-prebuilt-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
