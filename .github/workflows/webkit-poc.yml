name: WebKit PoC
on:
  pull_request:
    paths:
      - 'examples/webkit_viewport_poc.rs'
      - 'experiments/webkit_viewport.swift'
      - 'experiments/run_compiled_swift_hybrid.sh'
      - 'experiments/smoke_compiled_swift_webkit.py'
      - '.github/workflows/webkit-poc.yml'
  push:
    branches:
      - experiment/persistent-webkit-viewport
permissions:
  contents: read
jobs:
  macos-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: muleyuck/github-actions/actions/rust/setup@v1
      - name: Check PoC example
        run: cargo test --example webkit_viewport_poc --locked
      - name: Typecheck Swift helper
        run: swiftc -swift-version 5 -typecheck experiments/webkit_viewport.swift
      - name: Compile cached optimized Swift helper
        run: |
          bash experiments/run_compiled_swift_hybrid.sh --build-only > "$RUNNER_TEMP/doctty-swift-helper-path"
      - name: Smoke optimized Swift helper PNG and protocol
        run: |
          python3 -m py_compile experiments/smoke_compiled_swift_webkit.py
          python3 experiments/smoke_compiled_swift_webkit.py "$(cat "$RUNNER_TEMP/doctty-swift-helper-path")"

