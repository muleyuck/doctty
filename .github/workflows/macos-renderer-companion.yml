name: macOS renderer companion
on:
  pull_request:
    paths:
      - 'src/bin/doctty-renderer.rs'
      - 'src/io/webkit_snapshot/**'
      - 'src/render/github_html/**'
      - 'src/viewport/**'
      - 'native/macos/webkit_viewport.swift'
      - 'scripts/build_macos_webkit_helper.sh'
      - 'tests/smoke/smoke_compiled_swift_webkit.py'
      - '.github/workflows/macos-renderer-companion.yml'
permissions:
  contents: read
jobs:
  macos-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: muleyuck/github-actions/actions/rust/setup@v1
      - name: Test compiled renderer companion
        run: cargo test --bin doctty-renderer --locked
      - name: Typecheck Swift helper
        run: swiftc -swift-version 5 -typecheck native/macos/webkit_viewport.swift
      - name: Compile cached optimized Swift helper
        run: |
          bash scripts/build_macos_webkit_helper.sh --build-only > "$RUNNER_TEMP/doctty-swift-helper-path"
      - name: Smoke optimized Swift helper PNG and protocol
        run: |
          python3 -m py_compile tests/smoke/smoke_compiled_swift_webkit.py
          python3 tests/smoke/smoke_compiled_swift_webkit.py "$(cat "$RUNNER_TEMP/doctty-swift-helper-path")"

